name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            docs/package-lock.json

      - name: install
        run: |
          npm ci --prefix landing
          npm ci --prefix docs

      - name: build the landing
        run: npm run build --prefix landing

      - name: build the Starlight documentation
        run: npm run build --prefix docs

      - name: the landing at / and the docs under /docs/
        run: |
          mkdir -p _site
          cp -R landing/dist/. _site/
          cp -R docs/dist/. _site/docs/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
