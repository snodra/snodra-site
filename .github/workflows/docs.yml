name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Read the Docs build
        env:
          RTD_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$RTD_TOKEN" ] || { echo "READTHEDOCS_TOKEN is not set"; exit 1; }
          api=https://app.readthedocs.org/api/v3/projects/snodra-server
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
            curl -sS -o /dev/null -X POST "$api/versions/" \
              -H "Authorization: Token $RTD_TOKEN" -H 'Content-Type: application/json' \
              -d "{\"slug\":\"$version\",\"type\":\"tag\",\"verbose_name\":\"$version\"}" || true
          else
            version=latest
          fi
          curl -sS -f -X POST "$api/versions/$version/builds/" \
            -H "Authorization: Token $RTD_TOKEN" -H 'Content-Type: application/json' -d '{}'
          echo "Triggered the Read the Docs build for $version."
