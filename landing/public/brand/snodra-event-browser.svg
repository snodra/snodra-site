<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Snodra Event Browser, a raven">
  <title>Snodra Event Browser</title>
  <defs>
    <linearGradient id="snodra-body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#17153F"/>
    </linearGradient>
    <linearGradient id="snodra-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>
  <!-- tail: two long tapered feathers -->
  <path d="M92 156 L14 186 L18 202 L98 176 Z" fill="#17153F"/>
  <path d="M98 172 L24 220 L34 234 L110 190 Z" fill="#2A2660"/>
  <!-- body -->
  <path d="M94 190 C 62 176 54 136 72 110 C 88 86 120 72 150 74 C 186 76 208 100 208 132 C 208 166 176 196 136 200 C 116 202 104 198 94 190 Z" fill="url(#snodra-body)"/>
  <!-- wing -->
  <path d="M98 174 C 92 144 108 116 138 102 C 128 130 124 156 110 176 C 106 182 100 182 98 174 Z" fill="url(#snodra-wing)" opacity="0.9"/>
  <!-- wing edge -->
  <path d="M104 168 C 112 146 120 124 134 108" fill="none" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- head -->
  <circle cx="170" cy="92" r="48" fill="url(#snodra-body)"/>
  <!-- crest: two small feathers -->
  <path d="M150 48 C 146 34 154 24 168 22 C 162 32 162 42 166 50 Z" fill="#2A2660"/>
  <path d="M166 44 C 168 30 178 22 192 24 C 184 32 180 40 180 48 Z" fill="#17153F"/>
  <!-- throat hackles -->
  <path d="M148 138 L157 129 L164 140 L172 129 L179 140 L188 131" fill="none" stroke="#2A2660" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- beak: heavy, slightly hooked -->
  <path d="M208 82 C 226 84 241 90 250 97 C 241 106 224 112 208 112 C 199 103 199 91 208 82 Z" fill="#14B8A6"/>
  <path d="M208 97 C 223 98 234 100 244 101 C 234 105 221 108 208 107 Z" fill="#0F766E" opacity="0.55"/>
  <!-- eye -->
  <circle cx="184" cy="82" r="11" fill="#F8FAFC"/>
  <circle cx="186" cy="82" r="5.5" fill="#0F172A"/>
  <circle cx="188" cy="80" r="1.8" fill="#F8FAFC"/>
  <!-- legs and feet -->
  <path d="M116 200 L114 218 M140 200 L142 218" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
  <path d="M104 220 L114 220 L122 220 M132 220 L142 220 L152 220" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <!-- project badge -->
  <g transform="translate(200 200)">
    <circle r="44" fill="#FFFFFF"/>
    <circle r="38" fill="#64748B"/>
    <circle r="38" fill="none" stroke="#334155" stroke-width="2" opacity="0.35"/>
    <g>
        <path d="M-23 -17 H12 M-23 -6 H-9 M-23 5 H-9 M-23 16 H-2" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5"/>
        <circle cx="8" cy="3" r="10.5" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5"/>
        <path d="M16 11 L25 20" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.5"/>
      </g>
  </g>
</svg>
