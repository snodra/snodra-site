site_name: Snodra
site_description: One messaging stack for services that speak Kafka and gRPC, without a commercial messaging platform.
site_url: https://snodra.damoreira.com/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

not_in_nav: |
  404.md

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Your first service: getting-started/first-service.md
  - Core concepts:
      - concepts/index.md
      - CQRS: concepts/cqrs.md
      - Commands: concepts/commands.md
      - Queries: concepts/queries.md
      - Events: concepts/events.md
      - Event sourcing: concepts/event-sourcing.md
      - Sagas: concepts/sagas.md
      - Event processors: concepts/event-processors.md
      - Consistency: concepts/consistency.md
  - Reference:
      - reference/index.md
      - Server:
          - server/index.md
          - Quick start: server/quickstart.md
          - Authentication:
              - server/configuration/index.md
              - Anonymous: server/configuration/anonymous.md
              - Static token: server/configuration/token.md
              - OAuth2 / OIDC JWT: server/configuration/jwt-oauth2.md
              - mTLS: server/configuration/mtls.md
          - Server settings: server/configuration/server.md
          - Topology: server/topology.md
          - Dashboard: server/dashboard.md
          - Event processors: server/event-processors.md
          - Processor control: server/processor-control.md
          - Event browser: server/event-browser.md
          - Routing: server/routing.md
          - Protocol: server/protocol.md
          - Lifecycle: server/lifecycle.md
          - Operations: server/operations.md
          - Observability: server/observability.md
          - Build and image: server/build-and-image.md
          - Limitations: server/limitations.md
          - Licence: server/license.md
      - Messaging model: messaging/index.md
      - Kotlin library:
          - messaging/kotlin/index.md
          - Quick start: messaging/kotlin/quickstart.md
          - Configuration: messaging/kotlin/configuration.md
          - API: messaging/kotlin/api.md
          - Testing: messaging/kotlin/testing.md
          - Modules and build: messaging/kotlin/modules.md
      - Rust library:
          - messaging/rust/index.md
          - Quick start: messaging/rust/quickstart.md
          - Configuration: messaging/rust/configuration.md
          - API: messaging/rust/api.md
          - Dead letters: messaging/rust/dead-letters.md
          - Sagas: messaging/rust/sagas.md
          - Testing: messaging/rust/testing.md
          - Modules and build: messaging/rust/modules.md
  - Add-ons:
      - add-ons/index.md
      - Kafka event store: add-ons/kafka-event-store.md
      - RabbitMQ Streams event store: add-ons/rabbitmq-streams-event-store.md
      - MongoDB message store: add-ons/mongodb-message-store.md
      - SQL message store: add-ons/sql-message-store.md
  - Writing a library:
      - library-authors/index.md
      - Writing guide: library-authors/writing-a-library.md
      - Protocol: library-authors/protocol.md
      - Messages: library-authors/messages.md
      - Feature levels: library-authors/feature-levels.md
      - Event-store add-ons: library-authors/event-store-add-ons.md
      - Message-store add-ons: library-authors/message-store-add-ons.md
      - MongoDB layout: library-authors/mongodb-layout.md
      - Conformance: library-authors/conformance.md
  - Operations:
      - operations/index.md
      - Monitoring: operations/monitoring.md
      - Testing: operations/testing.md
      - Tuning: operations/tuning.md
      - Upgrades: operations/upgrades.md
  - Integrations:
      - integrations/index.md
      - Spring Boot: integrations/spring-boot.md
      - OAuth2 provider: integrations/oauth2.md
      - OpenTelemetry: integrations/opentelemetry.md
      - Containers: integrations/containers.md
      - Existing services: integrations/existing-service.md
  - Tools:
      - tools/index.md
      - Event browser: tools/event-browser.md
      - Conformance runner: tools/conformance-runner.md
  - Migration:
      - migration/index.md
      - Compatibility: migration/compatibility.md
  - Examples: examples/index.md
  - Editions: editions.md
  - Licence: concepts/license.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
