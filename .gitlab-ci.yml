workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

# Shell-executor pipeline: the runners have Python, pip and Docker installed.
stages:
  - build
  - release

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

build:
  stage: build
  script:
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install --quiet -r docs/requirements.txt
    - mkdocs build --strict
  artifacts:
    paths:
      - site
    expire_in: 1 week

release:
  stage: release
  resource_group: release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    GIT_DEPTH: '0'
  before_script:
    - git fetch --tags --force
    - printf '%s' "$HARBOR_USERNAME" > /tmp/hu; python3 -c 'print("user", repr(open("/tmp/hu").read()))'
    - printf '%s' "$HARBOR_PASSWORD" > /tmp/hp; python3 -c 'print("password bytes", len(open("/tmp/hp").read()))'
    - curl -s -o /dev/null -w 'harbor ping %{http_code}\n' -u "$(cat /tmp/hu):$(cat /tmp/hp)" "https://$HARBOR_HOST/v2/"
  dependencies: [build]
  script:
    - |
      set -euo pipefail
      CURRENT=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
      if [ -z "$CURRENT" ]; then CURRENT="v0.0.0"; fi
      if [ -n "${RELEASE_VERSION:-}" ]; then
        VERSION="${RELEASE_VERSION#v}"
        NEXT="v$VERSION"
        echo "Using explicit RELEASE_VERSION: $VERSION ($NEXT)"
      else
        if git describe --tags --exact-match >/dev/null 2>&1; then
          echo "HEAD is already tagged $(git describe --tags --exact-match); nothing to do."
          exit 0
        fi
        BUMP="${SEMVER_BUMP:-}"
        if [ -z "$BUMP" ]; then
          if [ "$CURRENT" = "v0.0.0" ]; then
            LOG=$(git log --format='%s%n%b')
          else
            LOG=$(git log "$CURRENT..HEAD" --format='%s%n%b')
          fi
          if [ -z "$LOG" ]; then
            echo "No new commits since $CURRENT; no release."
            exit 0
          fi
          if grep -qE 'BREAKING[ -]CHANGE|^[A-Za-z]+(\([^)]*\))?!:' <<< "$LOG"; then
            BUMP=major
          elif grep -qE '^feat(\([^)]*\))?:' <<< "$LOG"; then
            BUMP=minor
          else
            BUMP=patch
          fi
        fi
        case "$BUMP" in
          major|minor|patch) ;;
          *) echo "SEMVER_BUMP must be major, minor or patch"; exit 1 ;;
        esac
        V="${CURRENT#v}"
        IFS=. read -r MAJ MIN PAT <<< "$V"
        case "$BUMP" in
          major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
          minor) MIN=$((MIN+1)); PAT=0 ;;
          patch) PAT=$((PAT+1)) ;;
        esac
        NEXT="v$MAJ.$MIN.$PAT"
        VERSION="$MAJ.$MIN.$PAT"
        echo "Current: $CURRENT; bump: $BUMP; next: $NEXT"
      fi
      if [ "${DRY_RUN:-false}" = "true" ]; then
        echo "DRY_RUN: not tagging or publishing"
        exit 0
      fi
      IMAGE="$HARBOR_HOST/$HARBOR_PROJECT/$CI_PROJECT_NAME"
      echo "$HARBOR_PASSWORD" | docker login -u "$HARBOR_USERNAME" --password-stdin "$HARBOR_HOST"
      docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
      if ! git rev-parse "$NEXT" >/dev/null 2>&1; then
        git config user.name "snodra CI"
        git config user.email "ci@damoreira.ml"
        git tag -a "$NEXT" -m "$CI_PROJECT_NAME $NEXT"
        git push "$CI_REPOSITORY_URL" "$NEXT"
      else
        echo "Tag $NEXT already exists, skipping tag push"
      fi
      docker push "$IMAGE:$VERSION"
      docker push "$IMAGE:latest"
      RELEASE=$(jq -n \
        --arg name "$CI_PROJECT_NAME $NEXT" \
        --arg tag "$NEXT" \
        --arg desc "Release $VERSION. Image: $HARBOR_HOST/$HARBOR_PROJECT/$CI_PROJECT_NAME:$VERSION." \
        '{name:$name,tag_name:$tag,description:$desc}')
      STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
        --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$RELEASE" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases")
      case "$STATUS" in
        201|409) echo "Release $NEXT is available." ;;
        *) echo "Release API returned $STATUS"; exit 1 ;;
      esac
